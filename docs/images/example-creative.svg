<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">创意文案：经还在西边</title>
  <desc id="desc">取经未成，队里要减一人。猪八戒片段：束虎裙，抄铁棒，纵身下山；来时俺求他，去时他催俺。</desc>
  <rect width="640" height="400" fill="#f2f7f6"/>
  <rect width="8" height="400" fill="#17685e"/>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="36" y="54" font-size="28" font-weight="600" fill="#17685e">创意文案 / 角色陈述</text>
    <text x="36" y="140" font-size="58" font-weight="700" fill="#202527">经还在西边</text>
    <text x="36" y="193" font-size="28" fill="#4e5e59">取经未成，队里要减一人。</text>
    <path d="M36 228H604" stroke="#bbcfc9"/>
    <g font-size="30" fill="#202527">
      <text x="36" y="283">束虎裙，抄铁棒，纵身下山；</text>
      <text x="36" y="332">来时俺求他，去时他催俺。</text>
    </g>
    <text x="36" y="377" font-size="24" fill="#4e5e59">猪八戒 · 片段</text>
  </g>
</svg>
