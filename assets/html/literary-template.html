<!-- Generated by Writer Pen; HTML mechanics adapted from Reader's Seat -->
<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #222723;
      --muted: #515c56;
      --rule: #d5ddd8;
      --accent: #176146;
      --focus: #135d9d;
      --delete: #a42932;
      --insert: #156049;
      --body-font: "Songti SC", "Noto Serif CJK SC", "STSong", serif;
      --ui-font: "PingFang SC", "Microsoft YaHei", sans-serif;
      --reading-width: 42rem;
    }
    * { box-sizing: border-box; }
    html { font-size: 16px; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--body-font); letter-spacing: 0;
    }
    .page { width: min(calc(100% - 40px), var(--reading-width)); margin: 0 auto; padding: 52px 0 76px; }
    h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; letter-spacing: 0; }
    h1 { font-size: 30px; }
    h2 { font-size: 26px; }
    h3 { font-size: 20px; }
    article { scroll-margin-top: 24px; }
    article + article { margin-top: 56px; border-top: 1px solid var(--rule); padding-top: 40px; }
    article header { margin-bottom: 30px; }
    .prose { font-size: 18px; line-height: 1.95; overflow-wrap: anywhere; }
    .prose p { margin: 0 0 1.1em; white-space: pre-wrap; }
    .prose p:last-child { margin-bottom: 0; }
    .prose p:empty { min-height: 1em; }
    .collection { margin-bottom: 40px; }
    nav { margin-top: 22px; font-family: var(--ui-font); font-size: 15px; line-height: 1.7; }
    nav ol { padding-left: 1.4rem; margin: 0; }
    nav li + li { margin-top: 8px; }
    a { color: var(--accent); text-underline-offset: 4px; overflow-wrap: anywhere; }
    a:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .draft-notice, .notes { font-family: var(--ui-font); font-size: 15px; line-height: 1.7; }
    .draft-notice { border-left: 3px solid var(--delete); padding-left: 14px; margin: 0 0 28px; }
    .notes { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--rule); color: var(--muted); }
    .notes p { margin: 12px 0; }
    summary { cursor: pointer; }
    ins { color: var(--insert); text-decoration: underline; }
    del { color: var(--delete); text-decoration: line-through; }
    .table-wrap { max-width: 100%; overflow: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    th, td { border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; padding: 10px; }
    img { max-width: 100%; height: auto; }
    figure { margin: 28px 0; }
    figcaption { font: 15px/1.6 var(--ui-font); color: var(--muted); margin-top: 10px; }
    @media (max-width: 600px) {
      .page { width: calc(100% - 32px); padding-top: 30px; padding-bottom: 48px; }
      article header { margin-bottom: 24px; }
    }
    @media print {
      .page { width: 100%; max-width: none; padding: 0; }
      nav { display: none; }
      h1, h2, h3 { break-after: avoid; }
      article header { margin-bottom: 0; padding-bottom: 24px; break-inside: avoid; break-after: avoid; }
      .prose p { orphans: 3; widows: 3; }
      article + article { break-before: page; border: 0; margin-top: 0; padding-top: 0; }
      .table-wrap { overflow: visible; }
      a { color: var(--ink); }
    }
  </style>
</head>
<body>
  <main class="page">
{{CONTENT}}
  </main>
</body>
</html>
